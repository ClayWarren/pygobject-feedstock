name: Native Windows pygobject validation (fork only)
on:
  push:
    branches: [codex/windows-arm64-validation]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    if: github.repository == 'ClayWarren/pygobject-feedstock'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {subdir: win-arm64, runner: windows-11-arm, config: win_arm64_python3.14.____cp314}
          - {subdir: win-arm64, runner: windows-11-arm, config: win_arm64_python3.14.____cp314t}
          - {subdir: win-arm64, runner: windows-11-arm, config: win_arm64_python3.15.____cp315}
          - {subdir: win-64, runner: windows-2022, config: win_64_python3.14.____cp314}
          - {subdir: win-64, runner: windows-2022, config: win_64_python3.14.____cp314t}
          - {subdir: win-64, runner: windows-2022, config: win_64_python3.15.____cp315}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Prepare native runner and verified graphics prerequisites
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./ci/prepare.ps1 ${{ matrix.subdir }}
      - name: Build recipe and execute installed consumer tests
        shell: cmd
        run: ci\run.cmd ${{ matrix.subdir }} ${{ matrix.config }}
      - name: Stage artifacts
        if: always()
        shell: pwsh
        run: ./ci/stage.ps1 ${{ matrix.subdir }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pygobject-${{ matrix.config }}
          path: native-results/*
          retention-days: 14
